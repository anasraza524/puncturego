<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up · PunctureGo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="css/style.css" rel="stylesheet"></head>
<body data-page="register">
<a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#app">Skip to content</a>
<header id="nav"><nav class="navbar app-nav sticky-top"><div class="container-xl px-3"><a class="navbar-brand fw-bold text-white" href="index.html"><i class="bi bi-wrench-adjustable-circle-fill"></i> Puncture<span class="brand-go">Go</span></a><div class="ms-auto d-flex gap-2 align-items-center" id="navAuth"><button class="btn btn-sm btn-outline-light" id="themeBtn" aria-label="Toggle dark mode"><i class="bi bi-circle-half"></i></button><a class="btn btn-sm btn-outline-light d-none d-sm-inline" href="login.html">Login</a><a class="btn btn-sm btn-outline-light d-none d-sm-inline" href="register.html">Sign up</a><a class="btn btn-sm btn-primary" href="register-shop.html"><i class="bi bi-plus-lg"></i> Register Shop</a></div></div></nav></header>
<main id="app" class="container-xl px-3"><div class="auth-wrap"><div class="card card-soft w-100" style="max-width:640px"><div class="card-body p-4">
<h1 class="h3 mb-1">Create customer account</h1><p class="text-muted">Register with your CNIC, phone and address to request roadside help.</p>
<form id="regForm" novalidate class="row g-3">
<div class="col-12"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name"><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="cnic">CNIC</label><input class="form-control" id="cnic" name="cnic" inputmode="numeric" placeholder="42101-1234567-1"><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="phone">Mobile number</label><input class="form-control" id="phone" name="phone" inputmode="tel" placeholder="0300-1234567" autocomplete="tel"><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email"><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="area">Home area</label><select class="form-select" id="area" name="area"></select><div class="invalid-feedback"></div></div>
<div class="col-12"><label class="form-label" for="address">Address</label><textarea class="form-control" id="address" name="address" rows="2"></textarea><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password"><div class="invalid-feedback"></div></div>
<div class="col-md-6"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password"><div class="invalid-feedback"></div></div>
<div class="col-12 d-grid"><button class="btn btn-primary btn-lg" type="submit">Create account</button></div></form>
<p class="small mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body></html>
