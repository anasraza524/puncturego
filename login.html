<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · PunctureGo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="css/style.css" rel="stylesheet"></head>
<body data-page="login">
<a class="visually-hidden-focusable position-absolute p-2 bg-white" href="#app">Skip to content</a>
<header id="nav"><nav class="navbar app-nav sticky-top"><div class="container-xl px-3"><a class="navbar-brand fw-bold text-white" href="index.html"><i class="bi bi-wrench-adjustable-circle-fill"></i> Puncture<span class="brand-go">Go</span></a><div class="ms-auto d-flex gap-2 align-items-center" id="navAuth"><button class="btn btn-sm btn-outline-light" id="themeBtn" aria-label="Toggle dark mode"><i class="bi bi-circle-half"></i></button><a class="btn btn-sm btn-outline-light d-none d-sm-inline" href="login.html">Login</a><a class="btn btn-sm btn-outline-light d-none d-sm-inline" href="register.html">Sign up</a><a class="btn btn-sm btn-primary" href="register-shop.html"><i class="bi bi-plus-lg"></i> Register Shop</a></div></div></nav></header>
<main id="app" class="container-xl px-3"><div class="auth-wrap"><div class="card card-soft w-100" style="max-width:480px"><div class="card-body p-4">
<h1 class="h3 mb-1">Welcome back</h1><p class="text-muted">Log in to your PunctureGo account.</p>
<form id="loginForm" novalidate class="row g-3"><div id="loginAlert" class="col-12"></div>
<div class="col-12"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="username"><div class="invalid-feedback"></div></div>
<div class="col-12"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password"><div class="invalid-feedback"></div></div>
<div class="col-12 d-grid"><button class="btn btn-primary btn-lg" type="submit">Log in</button></div></form>
<hr><p class="small text-muted mb-2">Demo accounts (password <code>Pass@123</code>) – tap a role to fill the form:</p><div class="d-flex flex-wrap gap-2" id="demo"></div>
<p class="small mt-3 mb-0">New driver? <a href="register.html">Create an account</a> · Mechanic? <a href="register-shop.html">Register your shop</a></p></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body></html>
